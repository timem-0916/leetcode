name: 🐛 Bug 报告
description: 提交一个 Bug 帮助我们改进项目
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - timem
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈！请尽可能详细地填写以下信息，这将帮助我们快速定位问题。

  - type: input
    id: contact
    attributes:
      label: 联系方式（可选）
      description: 如果需要进一步沟通，请留下邮箱或微信。
      placeholder: ex. email@example.com
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 清晰简洁地描述 Bug 现象。
      placeholder: 告诉我们要复现这个 Bug 需要做什么...
      value: "当我点击..."
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 你原本期望发生什么？
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 复现步骤
      description: 请列出复现问题的步骤。
      placeholder: |
        1. 访问 xxx
        2. 点击 xxx
        3. 看到错误 xxx
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 环境信息
      description: 请选择你使用的环境。
      options:
        - Windows / Chrome
        - macOS / Safari
        - Linux / Firefox
        - 其他（请在下方说明）
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索过现有 Issues，没有重复提问
          required: true
        - label: 我已阅读过项目文档
          required: false